# Local entry point for the taskengine automation.
# Run from the taskengine/ directory:
#   ansible-playbook -i inventories/production/hosts.yml playbooks/site.yml
# The API worker injects ANSIBLE_ROLES_PATH itself (see backend/config.py), so
# this file only makes direct CLI runs deterministic for operators.

[defaults]
inventory = ./inventories/production/hosts.yml
roles_path = ./roles:./roles/wazuh
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
interpreter_python = auto_silent
