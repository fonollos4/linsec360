---
- name: Render the LinSec360 sysctl baseline
  ansible.builtin.template:
    src: 99-linsec-sysctl.conf.j2
    dest: "{{ hardening_sysctl_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Apply sysctl baseline
  ansible.builtin.command: sysctl --system
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
