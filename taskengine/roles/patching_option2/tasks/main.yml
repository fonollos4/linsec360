---
- name: Install dnf-automatic on RedHat family hosts
  ansible.builtin.package:
    name: "{{ patching_redhat_packages }}"
    state: present
  when: ansible_os_family == 'RedHat'

- name: Configure dnf-automatic for security updates only
  ansible.builtin.template:
    src: dnf-automatic.conf.j2
    dest: "{{ patching_dnf_automatic_conf }}"
    mode: '0644'
  when: ansible_os_family == 'RedHat'

- name: Enable the dnf-automatic timer
  ansible.builtin.systemd:
    name: dnf-automatic.timer
    enabled: true
    state: started
  when: ansible_os_family == 'RedHat'

- name: Install unattended-upgrades on Debian family hosts
  ansible.builtin.package:
    name: "{{ patching_debian_packages }}"
    state: present
  when: ansible_os_family == 'Debian'

- name: Configure unattended-upgrades security sources and reboot policy
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: "{{ patching_unattended_upgrades_conf }}"
    mode: '0644'
  when: ansible_os_family == 'Debian'

- name: Enable periodic unattended upgrades
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: "{{ patching_auto_upgrades_conf }}"
    mode: '0644'
  when: ansible_os_family == 'Debian'

- name: Enable the apt-daily-upgrade timer
  ansible.builtin.systemd:
    name: apt-daily-upgrade.timer
    enabled: true
    state: started
  when: ansible_os_family == 'Debian'

- name: Configure Ubuntu Pro livepatch
  when: ansible_distribution == 'Ubuntu'
  block:
    - name: Install the Ubuntu Pro client
      ansible.builtin.package:
        name: ubuntu-advantage-tools
        state: present

    - name: Read the current Ubuntu Pro attachment
      ansible.builtin.command: pro status --format json
      register: patching_pro_status_before
      changed_when: false
      failed_when: false

    - name: Parse the current Ubuntu Pro attachment
      ansible.builtin.set_fact:
        patching_pro_attached: >-
          {{ (patching_pro_status_before.stdout | from_json).attached | default(false)
             if patching_pro_status_before.rc == 0 else false }}

    - name: Attach the host to Ubuntu Pro with the vaulted token
      ansible.builtin.command:
        cmd: "pro attach {{ patching_ubuntu_pro_token }}"
      when:
        - patching_ubuntu_pro_token | length > 0
        - not patching_pro_attached | bool
      changed_when: true
      no_log: true

    - name: Re-read Ubuntu Pro status after attachment
      ansible.builtin.command: pro status --format json
      register: patching_pro_status_after
      changed_when: false
      failed_when: false

    - name: Parse the livepatch service state
      ansible.builtin.set_fact:
        patching_pro_current: >-
          {{ patching_pro_status_after.stdout | from_json
             if patching_pro_status_after.rc == 0 else {} }}
        patching_livepatch_enabled: >-
          {{ ((patching_pro_status_after.stdout | from_json).services | default([])
              | selectattr('name', 'equalto', 'livepatch')
              | map(attribute='status') | first | default('')) == 'enabled'
             if patching_pro_status_after.rc == 0 else false }}

    - name: Enable the Ubuntu Pro livepatch service
      ansible.builtin.command: pro enable livepatch --assume-yes
      when:
        - patching_pro_current.attached | default(false) | bool
        - not patching_livepatch_enabled | bool
      changed_when: true

    - name: Report a missing Ubuntu Pro token
      ansible.builtin.debug:
        msg: >-
          No ubuntu_pro_token was provided; livepatch stays disabled and
          security updates continue through unattended-upgrades.
      when: patching_ubuntu_pro_token | length == 0
      changed_when: false

- name: Deploy the patching status check for Wazuh command monitoring
  ansible.builtin.template:
    src: check_patching_status.sh.j2
    dest: "{{ patching_status_script }}"
    mode: '0755'
