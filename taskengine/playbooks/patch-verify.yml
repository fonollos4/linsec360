---
# Verify that selected packages are installed after patching and publish the
# result to LinSec360. No reboot is performed by this verification playbook.
- name: Verify native security patches
  hosts: all
  become: true
  gather_facts: true

  vars:
    patch_target_packages: "[]"
    patch_target_cves: "[]"
    patch_ingest_url: ""
    patch_api_token: ""

  tasks:
    - name: Normalize targeted package and CVE lists
      ansible.builtin.set_fact:
        patch_packages: "{{ patch_target_packages | from_json if patch_target_packages is string else patch_target_packages }}"
        patch_cves: "{{ patch_target_cves | from_json if patch_target_cves is string else patch_target_cves }}"

    - name: Collect installed package facts
      ansible.builtin.package_facts:
        manager: auto
      when: patch_packages | length > 0

    - name: Check whether a reboot is still required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: patch_reboot_required_debian
      when: ansible_os_family == "Debian"

    - name: Check whether a reboot is still required
      ansible.builtin.command: needs-restarting -r
      register: patch_reboot_required_redhat
      changed_when: false
      failed_when: false
      when: ansible_os_family == "RedHat"

    - name: Set the reboot requirement fact
      ansible.builtin.set_fact:
        patch_reboot_required: >-
          {{ (ansible_os_family == 'Debian' and patch_reboot_required_debian.stat.exists)
             or (ansible_os_family == 'RedHat' and patch_reboot_required_redhat.rc == 1) }}

    - name: Build verification checks
      ansible.builtin.set_fact:
        patch_result_checks: >-
          {{ patch_result_checks | default([]) + [{
            'package': item,
            'cve': (patch_cves[idx] if idx < patch_cves | length else ''),
            'installed_version': (ansible_facts.packages[item] | first).version
              if item in ansible_facts.packages else '',
            'verified': true,
            'reboot_required': patch_reboot_required | bool
          }] }}
      loop: "{{ patch_packages }}"
      loop_control:
        index_var: idx

    - name: Send verification results to LinSec360
      ansible.builtin.uri:
        url: "{{ patch_ingest_url.rstrip('/') }}/api/v1/patching/results"
        method: POST
        headers:
          Authorization: "Bearer {{ patch_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          host_name: "{{ inventory_hostname }}"
          checks: "{{ patch_result_checks | default([]) }}"
        status_code: [200, 201]
      no_log: true
      when:
        - patch_result_checks is defined
        - patch_result_checks | length > 0
        - patch_ingest_url | length > 0
        - patch_api_token | length > 0
