---
# Run an OpenSCAP XCCDF evaluation and fetch the ARF result.
#
#   ansible-playbook -i inventories/production/hosts.yml \
#     playbooks/openscap-scan.yml --limit rhel9 \
#     -e openscap_profile=cis_rhel.xml
#
# The ARF file is fetched to artifacts/openscap/ and can be POSTed to
# /api/v1/compliance/scans with artifact_path or content.
- name: Run an OpenSCAP compliance scan
  hosts: all
  become: true
  gather_facts: true

  vars:
    openscap_config_dir: "{{ linsec_config_dir | default(playbook_dir ~ '/../../config') }}"
    openscap_artifact_dir: "{{ linsec_artifact_dir | default(playbook_dir ~ '/../../artifacts') }}"
    # Extra vars (the UI profile selector) override play vars, so this must
    # never reference openscap_profile itself: that would recurse forever.
    openscap_profile: "{{ 'cis_rhel.xml' if ansible_os_family == 'RedHat' else 'cis_ubuntu.xml' }}"
    openscap_backend: ssg
    openscap_results_dir: /var/tmp/linsec-openscap
    # The tailoring file lives on the controller; oscap runs on the target, so
    # it must be staged there before evaluation.
    openscap_tailoring_source: "{{ openscap_config_dir }}/openscap/profiles/{{ openscap_profile }}"
    openscap_tailoring_file: "{{ openscap_results_dir }}/{{ openscap_profile }}"
    # The tailoring document points at the benchmark it extends. That hint must
    # name the data stream installed on the target (for example rhel9 vs
    # rhel10), otherwise oscap rejects the tailoring file as inapplicable.
    openscap_tailoring_content: >-
      {{ lookup('ansible.builtin.file', openscap_tailoring_source)
         | regex_replace('<xccdf:benchmark href="[^"]*"',
                         '<xccdf:benchmark href="' ~ openscap_ssg_datastream ~ '"')
      }}
    # When --tailoring-file is used, --profile must name a profile defined in
    # the tailoring document, not the base profile in the data stream.
    openscap_profile_id: >-
      {{ lookup('ansible.builtin.file', openscap_tailoring_source)
         | regex_findall('<xccdf:Profile\s+id="([^"]+)"')
         | first
         | default('') }}
    openscap_result_path: "{{ openscap_results_dir }}/{{ inventory_hostname }}-arf.xml"
    openscap_ingest_url: ""
    openscap_api_token: ""

  tasks:
    - name: Install the OpenSCAP scanner and SCAP Security Guide
      ansible.builtin.package:
        name: "{{ openscap_packages }}"
        state: present
      vars:
        openscap_packages: >-
          {{ ['openscap-scanner', 'scap-security-guide']
             if ansible_os_family == 'RedHat'
             else ['libopenscap8', 'openscap-scanner', 'ssg-debderived', 'ssg-base'] }}
      when: not ansible_check_mode

    - name: Find installed SCAP Security Guide data streams
      ansible.builtin.find:
        paths: /usr/share/xml/scap/ssg/content
        patterns: "ssg-*-ds.xml"
        file_type: file
      register: openscap_datastream_files

    - name: Build data stream candidates for this operating system
      ansible.builtin.set_fact:
        openscap_ssg_datastream_candidates: >-
          {{
            [
              'ssg-rhel' ~ ansible_distribution_major_version ~ '-ds.xml',
              'ssg-redhat' ~ ansible_distribution_major_version ~ '-ds.xml',
              'ssg-rl' ~ ansible_distribution_major_version ~ '-ds.xml',
              'ssg-rocky' ~ ansible_distribution_major_version ~ '-ds.xml',
              'ssg-alma' ~ ansible_distribution_major_version ~ '-ds.xml',
              'ssg-almalinux' ~ ansible_distribution_major_version ~ '-ds.xml',
              'ssg-ol' ~ ansible_distribution_major_version ~ '-ds.xml',
              'ssg-oraclelinux' ~ ansible_distribution_major_version ~ '-ds.xml',
              'ssg-cs' ~ ansible_distribution_major_version ~ '-ds.xml',
              'ssg-centos' ~ ansible_distribution_major_version ~ '-ds.xml'
            ]
            if ansible_os_family == 'RedHat'
            else [
              'ssg-ubuntu' ~
              (ansible_distribution_version | regex_replace('\\.', '')) ~
              '-ds.xml'
            ]
          }}

    - name: Select the data stream matching this operating system
      ansible.builtin.set_fact:
        openscap_ssg_datastream: >-
          {{
            openscap_ssg_datastream_candidates
            | select('in', openscap_datastream_files.files | map(attribute='path') | map('basename') | list)
            | list
            | first
            | default('')
          }}

    - name: Validate that a matching SCAP data stream was installed
      ansible.builtin.assert:
        that:
          - openscap_ssg_datastream | length > 0
        fail_msg: >-
          No SCAP Security Guide data stream was found for
          {{ ansible_distribution }} {{ ansible_distribution_version }}.
          Installed files: {{ openscap_datastream_files.files | map(attribute='path') | map('basename') | list }}

    - name: Ensure the scan result directory exists
      ansible.builtin.file:
        path: "{{ openscap_results_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Validate that the tailoring profile exists on the controller
      ansible.builtin.assert:
        that:
          - openscap_tailoring_source is file
        fail_msg: >-
          Tailoring profile {{ openscap_tailoring_source }} was not found on the
          controller. Check the configured profile directory.
      delegate_to: localhost
      become: false

    - name: Copy the tailoring profile to the target
      ansible.builtin.copy:
        content: "{{ openscap_tailoring_content }}"
        dest: "{{ openscap_tailoring_file }}"
        owner: root
        group: root
        mode: "0600"

    - name: Validate that the tailoring profile defines a profile id
      ansible.builtin.assert:
        that:
          - openscap_profile_id | length > 0
        fail_msg: >-
          No xccdf:Profile id was found in {{ openscap_tailoring_source }}.

    - name: Run the OpenSCAP XCCDF evaluation
      ansible.builtin.command: >-
        oscap xccdf eval
        --profile {{ openscap_profile_id }}
        --tailoring-file {{ openscap_tailoring_file }}
        --results {{ openscap_result_path }}
        --report {{ openscap_results_dir }}/{{ inventory_hostname }}-report.html
        /usr/share/xml/scap/ssg/content/{{ openscap_ssg_datastream }}
      register: openscap_scan
      changed_when: false
      failed_when: openscap_scan.rc not in [0, 2]
      check_mode: false

    - name: Fetch the ARF result to the controller
      ansible.builtin.fetch:
        src: "{{ openscap_result_path }}"
        dest: "{{ openscap_artifact_dir }}/openscap/"
        flat: true
      check_mode: false

    - name: Read the ARF result for API ingestion
      ansible.builtin.slurp:
        src: "{{ openscap_result_path }}"
      register: openscap_result_file
      when:
        - openscap_ingest_url | length > 0
        - openscap_api_token | length > 0

    - name: Send the ARF result to LinSec360
      ansible.builtin.uri:
        url: "{{ openscap_ingest_url.rstrip('/') }}/api/v1/compliance/scans"
        method: POST
        headers:
          Authorization: "Bearer {{ openscap_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          host_name: "{{ inventory_hostname }}"
          profile: "{{ openscap_profile }}"
          content: "{{ openscap_result_file.content | b64decode }}"
        status_code: [200, 201]
      when:
        - openscap_ingest_url | length > 0
        - openscap_api_token | length > 0
      failed_when: false
