---
# Native security patching. Targets are sent as package/CVE/fixed-version
# tuples from the selected LinSec360 findings. An empty list falls back to
# distribution security updates. Results are posted by the controller so the
# callback can reach the worker-owned API endpoint.
- name: Apply native security patches
  hosts: all
  become: true
  gather_facts: true

  vars:
    patch_targets: "[]"
    patch_reboot_allowed: false
    patch_reboot_timeout_seconds: 900
    patch_ingest_url: ""
    patch_api_token: ""

  tasks:
    - name: Normalize targeted patch tuples
      ansible.builtin.set_fact:
        patch_targets_list: >-
          {{ patch_targets | from_json if patch_targets is string else patch_targets }}
        patch_packages: >-
          {{ (patch_targets | from_json if patch_targets is string else patch_targets)
             | map(attribute='package') | unique | list }}

    - name: Record pre-patch boot identity
      ansible.builtin.command: cat /proc/sys/kernel/random/boot_id
      register: patch_boot_before
      changed_when: false

    - name: Refresh the package cache on Debian family hosts
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install selected packages on Debian family hosts
      ansible.builtin.apt:
        name: "{{ patch_packages }}"
        state: latest
      register: patch_install_debian
      when:
        - ansible_os_family == "Debian"
        - patch_packages | length > 0

    - name: Install selected packages on Red Hat family hosts
      ansible.builtin.dnf:
        name: "{{ patch_packages }}"
        state: latest
      register: patch_install_redhat
      when:
        - ansible_os_family == "RedHat"
        - patch_packages | length > 0

    - name: Apply security updates when no packages were selected
      ansible.builtin.apt:
        upgrade: safe
        default_release: "{{ ansible_distribution_release }}-security"
      when:
        - ansible_os_family == "Debian"
        - patch_packages | length == 0

    - name: Apply security updates on legacy Red Hat family hosts
      ansible.builtin.yum:
        name: "*"
        state: latest
        security: true
        update_only: true
      when:
        - ansible_os_family == "RedHat"
        - ansible_distribution_major_version | int < 8
        - patch_packages | length == 0

    - name: Apply security updates on modern Red Hat family hosts
      ansible.builtin.dnf:
        name: "*"
        state: latest
        security: true
        update_only: true
      when:
        - ansible_os_family == "RedHat"
        - ansible_distribution_major_version | int >= 8
        - patch_packages | length == 0

    - name: Check whether a reboot is required on Debian family hosts
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: patch_reboot_required_debian
      when: ansible_os_family == "Debian"

    - name: Check whether needs-restarting is available on Red Hat family hosts
      ansible.builtin.command: command -v needs-restarting
      register: patch_reboot_check
      changed_when: false
      failed_when: false
      when: ansible_os_family == "RedHat"

    - name: Check whether a reboot is required on Red Hat family hosts
      ansible.builtin.command: needs-restarting -r
      register: patch_reboot_required_redhat
      changed_when: false
      failed_when: false
      when:
        - ansible_os_family == "RedHat"
        - patch_reboot_check.rc == 0

    - name: Set the reboot requirement fact
      ansible.builtin.set_fact:
        patch_reboot_required: >-
          {{ (ansible_os_family == 'Debian' and patch_reboot_required_debian.stat.exists)
             or (ansible_os_family == 'RedHat' and patch_reboot_check.rc == 0
                 and patch_reboot_required_redhat.rc == 1) }}

    - name: Reboot only when required and explicitly allowed
      ansible.builtin.reboot:
        reboot_timeout: "{{ patch_reboot_timeout_seconds }}"
        msg: "LinSec360 security patch reboot"
      when:
        - patch_reboot_allowed | bool
        - patch_reboot_required | bool

    - name: Determine whether the targeted install succeeded
      ansible.builtin.set_fact:
        patch_install_succeeded: >-
          {{ (patch_install_debian is defined and patch_install_debian is succeeded)
             or (patch_install_redhat is defined and patch_install_redhat is succeeded) }}

    - name: Build patch result checks
      ansible.builtin.set_fact:
        patch_result_checks: >-
          {{ patch_result_checks | default([]) + [{
            'package': item.package,
            'cve': item.cve | default('', true),
            'fixed_version': item.fixed_version | default('', true),
            'applied': patch_install_succeeded | bool,
            'reboot_required': patch_reboot_required | bool
          }] }}
      loop: "{{ patch_targets_list }}"

    - name: Send patch results to LinSec360
      ansible.builtin.uri:
        url: "{{ patch_ingest_url.rstrip('/') }}/api/v1/patching/results"
        method: POST
        headers:
          Authorization: "Bearer {{ patch_api_token }}"
          Content-Type: application/json
        body_format: json
        body:
          host_name: "{{ inventory_hostname }}"
          checks: "{{ patch_result_checks | default([]) }}"
        status_code: [200, 201]
      delegate_to: localhost
      become: false
      no_log: true
      when:
        - patch_result_checks is defined
        - patch_result_checks | length > 0
        - patch_ingest_url | length > 0
        - patch_api_token | length > 0

    - name: Report the patch outcome
      ansible.builtin.debug:
        msg:
          host: "{{ inventory_hostname }}"
          packages: "{{ patch_packages }}"
          reboot_required: "{{ patch_reboot_required }}"
          reboot_allowed: "{{ patch_reboot_allowed }}"
