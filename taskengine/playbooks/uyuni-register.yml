---
# Register a host with the Uyuni control plane.
#
# Required extra vars:
#   uyuni_server: uyuni.example.com
# Optional:
#   uyuni_activation_key: 1-linsec-production
#   uyuni_bootstrap_url: https://uyuni.example.com/pub/bootstrap/bootstrap.sh
#
# The activation key is not a secret, but keep any Uyuni credentials in Ansible
# Vault or the platform secret store.
- name: Register hosts with Uyuni
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Worker injects the agent-facing server from the stack settings; an
    # explicit extra var (uyuni_server=...) still takes precedence.
    uyuni_server: "{{ linsec_uyuni_server | default('', true) }}"
    uyuni_bootstrap_url: "https://{{ uyuni_server }}/pub/bootstrap/bootstrap.sh"
    uyuni_activation_key: ""
    uyuni_bootstrap_script: /var/tmp/linsec-uyuni-bootstrap.sh

  tasks:
    - name: Validate that the Uyuni server was provided
      ansible.builtin.assert:
        that:
          - uyuni_server | length > 0
        fail_msg: >-
          uyuni_server is required. Configure "Adresse Uyuni (agents)" in the
          stack settings, or pass -e uyuni_server=<hostname>.

    - name: Download the Uyuni bootstrap script
      ansible.builtin.get_url:
        url: "{{ uyuni_bootstrap_url }}"
        dest: "{{ uyuni_bootstrap_script }}"
        owner: root
        group: root
        mode: "0700"
        # Uyuni serves its own CA; the script installs it before registering.
        validate_certs: false
      when: not ansible_check_mode

    - name: Register the host with Uyuni
      ansible.builtin.command: "sh {{ uyuni_bootstrap_script }}"
      environment:
        # The generated bootstrap script reads these environment variables;
        # it does not accept --server / --activationkey flags.
        MGR_SERVER_HOSTNAME: "{{ uyuni_server }}"
        ACTIVATION_KEYS: "{{ uyuni_activation_key }}"
      register: uyuni_registration
      changed_when: "'already registered' not in (uyuni_registration.stdout | default(''))"
      failed_when:
        - uyuni_registration.rc != 0
        - "'already registered' not in (uyuni_registration.stdout | default(''))"
      check_mode: false
      when: not ansible_check_mode

    - name: Remove the bootstrap script
      ansible.builtin.file:
        path: "{{ uyuni_bootstrap_script }}"
        state: absent
      when: not ansible_check_mode
