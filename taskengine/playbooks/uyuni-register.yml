---
# Register a host with the Uyuni control plane.
#
# Required extra vars:
#   uyuni_server: uyuni.example.com
# Optional:
#   uyuni_server_port: 8443
#   uyuni_activation_key: 1-linsec-production
#   uyuni_client_tools_repo: https://.../EL10-Uyuni-Client-Tools/EL_10/
#
# The activation key is not a secret, but keep any Uyuni credentials in Ansible
# Vault or the platform secret store.
- name: Register hosts with Uyuni
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Worker injects the agent-facing server from the stack settings; an
    # explicit extra var (uyuni_server=...) still takes precedence.
    uyuni_server: "{{ linsec_uyuni_server | default('', true) }}"
    uyuni_server_port: "{{ linsec_uyuni_server_port | default(443) | int }}"
    uyuni_base_url: >-
      https://{{ uyuni_server }}{% if uyuni_server_port != 443 %}:{{ uyuni_server_port }}{% endif %}
    uyuni_bootstrap_url: "{{ uyuni_base_url }}/pub/bootstrap/bootstrap.sh"
    uyuni_activation_key: ""
    uyuni_bootstrap_script: /var/tmp/linsec-uyuni-bootstrap.sh
    # The Uyuni server only serves a per-OS bootstrap repository after its
    # client tools channels have been synced. Until then the bootstrap script
    # cannot install Salt on its own. Fall back to the public Uyuni client
    # tools repository for this OS; set the var to "" to disable the fallback.
    uyuni_client_tools_repo: >-
      {{
        'https://download.opensuse.org/repositories/'
        ~ 'systemsmanagement:/Uyuni:/Master:/EL'
        ~ ansible_distribution_major_version
        ~ '-Uyuni-Client-Tools/EL_'
        ~ ansible_distribution_major_version
        ~ '/'
        if ansible_os_family == 'RedHat'
        else ''
      }}

  tasks:
    - name: Validate that the Uyuni server was provided
      ansible.builtin.assert:
        that:
          - uyuni_server | length > 0
          - uyuni_server_port | int > 0
          - uyuni_server_port | int < 65536
        fail_msg: >-
          uyuni_server is required. Configure "Adresse Uyuni (agents)" in the
          stack settings, or pass -e uyuni_server=<hostname>.

    - name: Download the Uyuni bootstrap script
      ansible.builtin.get_url:
        url: "{{ uyuni_bootstrap_url }}"
        dest: "{{ uyuni_bootstrap_script }}"
        owner: root
        group: root
        mode: "0700"
        # Uyuni serves its own CA; the script installs it before registering.
        validate_certs: false
      when: not ansible_check_mode

    - name: Check whether the Uyuni Salt bundle is already installed
      ansible.builtin.command: rpm -q venv-salt-minion
      register: uyuni_salt_bundle
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Add the public Uyuni client tools repository
      ansible.builtin.yum_repository:
        name: uyuni-client-tools
        description: Uyuni Client Tools
        baseurl: "{{ uyuni_client_tools_repo }}"
        enabled: true
        gpgcheck: false
        repo_gpgcheck: false
      when:
        - not ansible_check_mode
        - uyuni_client_tools_repo | length > 0
        - uyuni_salt_bundle.rc != 0

    - name: Install the Uyuni Salt bundle
      ansible.builtin.dnf:
        name: venv-salt-minion
        state: present
      when:
        - not ansible_check_mode
        - uyuni_client_tools_repo | length > 0
        - uyuni_salt_bundle.rc != 0

    - name: Use the configured Uyuni HTTPS port in the bootstrap script
      ansible.builtin.replace:
        path: "{{ uyuni_bootstrap_script }}"
        regexp: '^HTTPS_PUB_DIRECTORY=.*$'
        replace: 'HTTPS_PUB_DIRECTORY={{ uyuni_base_url }}/pub'
      when: not ansible_check_mode

    - name: Make the bootstrap repository URL use the configured HTTPS port
      ansible.builtin.replace:
        path: "{{ uyuni_bootstrap_script }}"
        regexp: '^    CLIENT_REPOS_ROOT="\$\{CLIENT_REPOS_ROOT:-https://\$\{HOSTNAME\}/pub/repositories\}"$'
        replace: '    CLIENT_REPOS_ROOT="${CLIENT_REPOS_ROOT:-${HTTPS_PUB_DIRECTORY}/repositories}"'
      when: not ansible_check_mode

    - name: Make the bootstrap script reuse the pre-installed Salt bundle
      ansible.builtin.replace:
        path: "{{ uyuni_bootstrap_script }}"
        regexp: '^VENV_ENABLED=0$'
        replace: 'VENV_ENABLED=$(rpm -q venv-salt-minion >/dev/null 2>&1 && echo 1 || echo 0)'
      when: not ansible_check_mode

    - name: Register the host with Uyuni
      ansible.builtin.command: "sh {{ uyuni_bootstrap_script }}"
      environment:
        # The generated bootstrap script reads these environment variables;
        # it does not accept --server / --activationkey flags.
        MGR_SERVER_HOSTNAME: "{{ uyuni_server }}"
        ACTIVATION_KEYS: "{{ uyuni_activation_key }}"
      register: uyuni_registration
      changed_when: "'already registered' not in (uyuni_registration.stdout | default(''))"
      failed_when:
        - uyuni_registration.rc != 0
        - "'already registered' not in (uyuni_registration.stdout | default(''))"
      check_mode: false
      when: not ansible_check_mode

    - name: Remove the bootstrap script
      ansible.builtin.file:
        path: "{{ uyuni_bootstrap_script }}"
        state: absent
      when: not ansible_check_mode
