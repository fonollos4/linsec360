---
# Primary LinSec360 automation entry point.
#
#   cd taskengine && ansible-playbook -i inventories/production/hosts.yml playbooks/site.yml
#
# Roles are ordered so that the legacy Salt/Uyuni footprint is removed before
# MAC hardening, OpenSCAP remediation and automatic patching are configured.
# Every role is written to be safe to re-run: no task changes the remote host
# unless its desired state is not already satisfied.
- name: Apply the LinSec360 hardening and patching baseline
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: cleanup_uyuni
      tags: [cleanup, uyuni]
    - role: hardening_mac
      tags: [hardening, mac]
    - role: hardening_openscap
      tags: [hardening, openscap, compliance]
    - role: patching_option2
      tags: [patching, updates, wazuh]
