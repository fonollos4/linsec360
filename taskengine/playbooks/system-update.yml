---
- name: Apply available operating system updates
  hosts: all
  gather_facts: true
  become: true

  tasks:
    - name: Update Debian and Ubuntu package cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == "Debian"

    - name: Install Debian and Ubuntu updates
      ansible.builtin.apt:
        upgrade: dist
      when: ansible_os_family == "Debian"

    - name: Update Red Hat family packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
      when: ansible_os_family == "RedHat"
