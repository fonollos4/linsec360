# Ansible configuration for the new backend worker.
#
# The legacy image installs the full `ansible` package, which ships the `yaml`
# stdout callback. The new image installs only `ansible-core`, so use the
# always-available `default` callback instead.

[defaults]
home = /opt/linsec/taskengine
inventory = /opt/linsec/taskengine/inventories
roles_path = /opt/linsec/taskengine/roles:/opt/linsec/taskengine/roles/wazuh
local_tmp = /opt/linsec/taskengine/.ansible/tmp
library = /opt/linsec/taskengine/library
log_path = /opt/linsec/logs/ansible.log
remote_user = linsecagent
private_key_file = /opt/linsec/.ssh/id_ed25519
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
forks = 20
timeout = 30

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True
control_path = /tmp/ssh-%%C
