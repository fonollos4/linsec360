# New backend stack: FastAPI + PostgreSQL + Redis + RQ worker.
#
#   docker compose -f docker-compose.v2.yml up --build
#
# Required in .env:
#   POSTGRES_PASSWORD
#   LINSEC_SECRET_KEY              (openssl rand -hex 32)
#   LINSEC_BOOTSTRAP_ADMIN_PASSWORD
#
# Wazuh services and the backend share this stack. Ansible is installed in
# the API and worker image through backend/Dockerfile.

x-backend-environment: &backend-environment
  PYTHONPATH: /opt/linsec
  LINSEC_ENVIRONMENT: ${LINSEC_ENVIRONMENT:-development}
  LINSEC_SECRET_KEY: ${LINSEC_SECRET_KEY:?Set LINSEC_SECRET_KEY in .env}
  LINSEC_COOKIE_SECURE: ${LINSEC_COOKIE_SECURE:-false}
  LINSEC_DATABASE_URL: postgresql+psycopg://linsec:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/linsec
  LINSEC_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  LINSEC_REDIS_URL: redis://redis:6379/0
  LINSEC_BOOTSTRAP_ADMIN_USERNAME: ${LINSEC_BOOTSTRAP_ADMIN_USERNAME:-admin}
  LINSEC_BOOTSTRAP_ADMIN_PASSWORD: ${LINSEC_BOOTSTRAP_ADMIN_PASSWORD:?Set LINSEC_BOOTSTRAP_ADMIN_PASSWORD in .env}
  LINSEC_AUTO_CREATE_TABLES: "false"
  LINSEC_LOG_DIR: /opt/linsec/logs
  LINSEC_TASKENGINE_DIR: /opt/linsec/taskengine
  LINSEC_PLAYBOOK_DIR: /opt/linsec/var/playbooks
  LINSEC_INVENTORY_DIR: /opt/linsec/var/inventories
  LINSEC_BUNDLED_PLAYBOOKS_DIR: /opt/linsec/taskengine/playbooks
  LINSEC_CONFIG_DIR: /opt/linsec/config
  LINSEC_ARTIFACT_DIR: /opt/linsec/var/artifacts
  LINSEC_OPENSCAP_PROFILE_DIR: /opt/linsec/config/openscap/profiles
  LINSEC_HARDENING_BASELINE_PATH: /opt/linsec/config/hardening/baseline.yml
  LINSEC_CORS_ORIGINS: ${LINSEC_CORS_ORIGINS:-["http://localhost:5173","http://localhost"]}
  LINSEC_WAZUH_API_URL: ${LINSEC_WAZUH_API_URL:-https://wazuh.manager:55000}
  LINSEC_WAZUH_API_USERNAME: ${WAZUH_API_USERNAME:-wazuh-wui}
  LINSEC_WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:-}
  LINSEC_WAZUH_API_VERIFY_TLS: ${LINSEC_WAZUH_API_VERIFY_TLS:-true}
  LINSEC_WAZUH_INDEXER_URL: ${LINSEC_WAZUH_INDEXER_URL:-https://wazuh.indexer:9200}
  LINSEC_WAZUH_INDEXER_USERNAME: ${WAZUH_INDEXER_USERNAME:-admin}
  LINSEC_WAZUH_INDEXER_PASSWORD: ${WAZUH_ADMIN_PASSWORD:-}
  LINSEC_WAZUH_INDEXER_VERIFY_TLS: ${LINSEC_WAZUH_INDEXER_VERIFY_TLS:-true}
  LINSEC_WAZUH_CA_BUNDLE: /opt/linsec/certs/wazuh/root-ca.pem
  LINSEC_UYUNI_API_URL: ${LINSEC_UYUNI_API_URL:-http://uyuni/rpc/api}
  LINSEC_UYUNI_USERNAME: ${UYUNI_ADMIN_USERNAME:-${LINSEC_UYUNI_USERNAME:-admin}}
  LINSEC_UYUNI_PASSWORD: ${UYUNI_ADMIN_PASSWORD:-${LINSEC_UYUNI_PASSWORD:-}}
  LINSEC_UYUNI_VERIFY_TLS: ${LINSEC_UYUNI_VERIFY_TLS:-true}
  LINSEC_UYUNI_TIMEOUT_SECONDS: ${LINSEC_UYUNI_TIMEOUT_SECONDS:-30}

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  args:
    LINSEC_UID: ${LINSEC_UID:-1000}
    LINSEC_GID: ${LINSEC_GID:-1000}

x-backend-volumes: &backend-volumes
  - linsec_var:/opt/linsec/var
  - linsec_logs:/opt/linsec/logs
  - ./.ssh:/opt/linsec/.ssh:ro
  - ./config/wazuh/indexer_ssl_certs:/opt/linsec/certs/wazuh:ro

services:
  wazuh-config:
    image: python:3.13-alpine
    restart: "no"
    env_file:
      - .env
    environment:
      WAZUH_ADMIN_PASSWORD: ${WAZUH_ADMIN_PASSWORD:-}
      WAZUH_ADMIN_PASSWORD_HASH: ${WAZUH_ADMIN_PASSWORD_HASH:-}
      WAZUH_DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:-}
      WAZUH_DASHBOARD_PASSWORD_HASH: ${WAZUH_DASHBOARD_PASSWORD_HASH:-}
      WAZUH_API_USERNAME: ${WAZUH_API_USERNAME:-wazuh-wui}
      WAZUH_API_PASSWORD: ${WAZUH_API_PASSWORD:-}
    volumes:
      - ./:/workspace:ro
      - ./config/wazuh/generated:/workspace/config/wazuh/generated:rw
    working_dir: /workspace
    command: ["python", "config/scripts/render-wazuh-config.py"]

  wazuh.manager:
    image: wazuh/wazuh-manager:4.12.0
    hostname: wazuh.manager
    restart: always
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    ports:
      - "${WAZUH_MANAGER_PORT:-1514}:1514"
      - "${WAZUH_MANAGER_ENROLLMENT_PORT:-1515}:1515"
      - "${WAZUH_SYSLOG_PORT:-514}:514/udp"
      - "${WAZUH_API_PORT:-55000}:55000"
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_ADMIN_PASSWORD:?Set WAZUH_ADMIN_PASSWORD in .env}
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/root-ca.pem
      SSL_CERTIFICATE: /etc/ssl/filebeat.pem
      SSL_KEY: /etc/ssl/filebeat.key
      API_USERNAME: ${WAZUH_API_USERNAME:?Set WAZUH_API_USERNAME in .env}
      API_PASSWORD: ${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD in .env}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - ./config/wazuh/api.yaml:/var/ossec/api/configuration/api.yaml:ro
      - ./config/wazuh/indexer_ssl_certs/wazuh.manager.pem:/var/ossec/api/configuration/ssl/server.crt:ro
      - ./config/wazuh/indexer_ssl_certs/wazuh.manager-key.pem:/var/ossec/api/configuration/ssl/server.key:ro
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh/indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./config/wazuh/indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem:ro
      - ./config/wazuh/indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key:ro
      - ./config/wazuh/cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
    depends_on:
      wazuh.indexer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status 2>/dev/null | grep -q 'wazuh-apid is running' && /var/ossec/bin/wazuh-control status 2>/dev/null | grep -q 'wazuh-analysisd is running'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.12.0
    hostname: wazuh.indexer
    restart: always
    ports:
      - "${WAZUH_INDEXER_PORT:-9200}:9200"
    environment:
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh/indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem:ro
      - ./config/wazuh/indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key:ro
      - ./config/wazuh/indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem:ro
      - ./config/wazuh/indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem:ro
      - ./config/wazuh/indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem:ro
      - ./config/wazuh/indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ./config/wazuh/generated/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml:ro
    depends_on:
      wazuh-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk --cert /usr/share/wazuh-indexer/certs/admin.pem --key /usr/share/wazuh-indexer/certs/admin-key.pem https://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.12.0
    hostname: wazuh.dashboard
    restart: always
    ports:
      - "${WAZUH_DASHBOARD_PORT:-443}:5601"
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: ${WAZUH_ADMIN_PASSWORD:?Set WAZUH_ADMIN_PASSWORD in .env}
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: ${WAZUH_DASHBOARD_PASSWORD:?Set WAZUH_DASHBOARD_PASSWORD in .env}
      API_USERNAME: ${WAZUH_API_USERNAME:?Set WAZUH_API_USERNAME in .env}
      API_PASSWORD: ${WAZUH_API_PASSWORD:?Set WAZUH_API_PASSWORD in .env}
    volumes:
      - ./config/wazuh/indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem:ro
      - ./config/wazuh/indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem:ro
      - ./config/wazuh/indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./config/wazuh/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./config/wazuh/generated/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      wazuh-config:
        condition: service_completed_successfully
      wazuh.indexer:
        condition: service_healthy
      wazuh.manager:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://localhost:5601/app/wazuh >/dev/null 2>&1 || curl -fk https://localhost:5601/status >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 60s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${LINSEC_WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: linsec
      POSTGRES_USER: linsec
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - linsec_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - |
          escaped_password=$$(printf '%s' "$$POSTGRES_PASSWORD" | sed "s/'/''/g")
          psql -U linsec -d linsec -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE linsec PASSWORD '$$escaped_password'" >/dev/null &&
          pg_isready -U linsec -d linsec
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - linsec_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  uyuni-config:
    profiles: ["uyuni"]
    image: alpine:3.20
    restart: "no"
    environment:
      UYUNI_ADMIN_PASSWORD: ${UYUNI_ADMIN_PASSWORD:-}
      UYUNI_POSTGRES_PASSWORD: ${UYUNI_POSTGRES_PASSWORD:-}
      UYUNI_DB_PASSWORD: ${UYUNI_DB_PASSWORD:-}
      UYUNI_REPORT_DB_PASSWORD: ${UYUNI_REPORT_DB_PASSWORD:-}
      UYUNI_FQDN: ${UYUNI_FQDN:-uyuni}
    volumes:
      - uyuni-certs-v3:/certs
    command:
      - sh
      - -c
      - |
        test -n "$UYUNI_ADMIN_PASSWORD" || { echo "Missing required Uyuni deployment variable: UYUNI_ADMIN_PASSWORD" >&2; exit 1; }
        test -n "$UYUNI_POSTGRES_PASSWORD" || { echo "Missing required Uyuni deployment variable: UYUNI_POSTGRES_PASSWORD" >&2; exit 1; }
        test -n "$UYUNI_DB_PASSWORD" || { echo "Missing required Uyuni deployment variable: UYUNI_DB_PASSWORD" >&2; exit 1; }
        test -n "$UYUNI_REPORT_DB_PASSWORD" || { echo "Missing required Uyuni deployment variable: UYUNI_REPORT_DB_PASSWORD" >&2; exit 1; }
        if [ ! -f /certs/trust/anchors/LOCAL-RHN-ORG-TRUSTED-SSL-CERT ]; then
          apk add --no-cache openssl >/dev/null
          mkdir -p /certs/trust/anchors /certs/tls/certs /certs/tls/private
          openssl req -x509 -newkey rsa:4096 -nodes -days 3650 \
            -subj "/CN=LinSec360 Uyuni CA" \
            -keyout /certs/tls/private/uyuni-ca.key \
            -out /certs/trust/anchors/LOCAL-RHN-ORG-TRUSTED-SSL-CERT >/dev/null 2>&1
          openssl req -newkey rsa:4096 -nodes \
            -subj "/CN=$UYUNI_FQDN" \
            -keyout /certs/tls/private/spacewalk.key \
            -out /tmp/uyuni.csr >/dev/null 2>&1
          printf 'subjectAltName=DNS:%s,DNS:localhost,IP:127.0.0.1\nextendedKeyUsage=serverAuth\n' "$UYUNI_FQDN" >/tmp/uyuni.ext
          openssl x509 -req -days 3650 -in /tmp/uyuni.csr \
            -CA /certs/trust/anchors/LOCAL-RHN-ORG-TRUSTED-SSL-CERT \
            -CAkey /certs/tls/private/uyuni-ca.key -CAcreateserial \
            -extfile /tmp/uyuni.ext \
            -out /certs/tls/certs/spacewalk.crt >/dev/null 2>&1
          cp /certs/trust/anchors/LOCAL-RHN-ORG-TRUSTED-SSL-CERT \
            /certs/trust/anchors/DB-RHN-ORG-TRUSTED-SSL-CERT
          chmod 600 /certs/tls/private/*.key
        fi
        echo "Uyuni deployment configuration is complete"

  uyuni-db:
    profiles: ["uyuni"]
    image: registry.opensuse.org/uyuni/server-postgresql:latest
    restart: unless-stopped
    environment:
      TZ: ${UYUNI_TIMEZONE:-Etc/UTC}
      POSTGRES_USER: ${UYUNI_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${UYUNI_POSTGRES_PASSWORD:-}
      MANAGER_USER: ${UYUNI_DB_USERNAME:-uyuni}
      MANAGER_PASS: ${UYUNI_DB_PASSWORD:-}
      REPORT_DB_USER: ${UYUNI_REPORT_DB_USERNAME:-reportdb}
      REPORT_DB_PASS: ${UYUNI_REPORT_DB_PASSWORD:-}
      POD_NETWORK: ${UYUNI_POD_NETWORK:-172.30.0.0/16}
    volumes:
      - uyuni-postgresql-v3:/var/lib/pgsql/data
      - uyuni-certs-v3:/etc/pki
    depends_on:
      uyuni-config:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d susemanager 2>/dev/null || pg_isready -U postgres"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s

  uyuni-pg-hba:
    profiles: ["uyuni"]
    image: postgres:16-alpine
    restart: "no"
    environment:
      UYUNI_POSTGRES_PASSWORD: ${UYUNI_POSTGRES_PASSWORD:-}
      UYUNI_POD_NETWORK: ${UYUNI_POD_NETWORK:-172.30.0.0/16}
      PGCONNECT_TIMEOUT: "5"
    volumes:
      - uyuni-postgresql-v3:/var/lib/pgsql/data
    depends_on:
      uyuni-db:
        condition: service_healthy
    command:
      - sh
      - -c
      - |
        test -n "$UYUNI_POSTGRES_PASSWORD" || exit 1
        grep -Fq "host all all $UYUNI_POD_NETWORK scram-sha-256" /var/lib/pgsql/data/pg_hba_custom.conf 2>/dev/null ||
          printf '\nhost all all %s scram-sha-256\n' "$UYUNI_POD_NETWORK" >> /var/lib/pgsql/data/pg_hba_custom.conf
        PGPASSWORD="$UYUNI_POSTGRES_PASSWORD" psql -h uyuni-db -U postgres -d postgres -v ON_ERROR_STOP=1 -tAc 'SELECT pg_reload_conf()'

  uyuni:
    profiles: ["uyuni"]
    image: registry.opensuse.org/uyuni/server:latest
    hostname: ${UYUNI_FQDN:-uyuni}
    restart: unless-stopped
    privileged: true
    cap_add:
      - SYS_ADMIN
    environment:
      container: oci
      TZ: ${UYUNI_TIMEZONE:-Etc/UTC}
      UYUNI_HOSTNAME: ${UYUNI_FQDN:-uyuni}
      ADMIN_USER: ${UYUNI_ADMIN_USERNAME:-admin}
      ADMIN_PASS: ${UYUNI_ADMIN_PASSWORD:-}
      MANAGER_USER: ${UYUNI_DB_USERNAME:-uyuni}
      MANAGER_PASS: ${UYUNI_DB_PASSWORD:-}
      REPORT_DB_USER: ${UYUNI_REPORT_DB_USERNAME:-reportdb}
      REPORT_DB_PASS: ${UYUNI_REPORT_DB_PASSWORD:-}
      MANAGER_DB_NAME: susemanager
      MANAGER_DB_HOST: uyuni-db
      MANAGER_DB_PORT: "5432"
      EXTERNALDB_PROVIDER: ""
      REPORT_DB_NAME: reportdb
      REPORT_DB_HOST: uyuni-db
      REPORT_DB_PORT: "5432"
      MANAGER_ADMIN_EMAIL: ${UYUNI_ADMIN_EMAIL:-admin@uyuni.local}
      MANAGER_MAIL_FROM: ${UYUNI_MAIL_FROM:-admin@uyuni.local}
    ports:
      - "${UYUNI_HTTP_PORT:-8081}:80"
      - "${UYUNI_HTTPS_PORT:-8443}:443"
      - "${UYUNI_SALT_PUBLISH_PORT:-4505}:4505"
      - "${UYUNI_SALT_REQUEST_PORT:-4506}:4506"
    volumes:
      - uyuni-var-v3:/var/lib/uyuni
      - uyuni-etc-v3:/etc/uyuni
      - uyuni-certs-v3:/etc/pki
      - uyuni-cache-v3:/var/cache
      - uyuni-spacewalk-v3:/srv/www/htdocs
      - uyuni-postgresql-v3:/var/lib/pgsql:ro
      - ./config/uyuni/enable-https.sh:/docker-entrypoint-init.d/99-uyuni-enable-https.sh:ro
    depends_on:
      uyuni-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fk https://localhost/rpc/api >/dev/null 2>&1 || curl -f http://localhost/rpc/api >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 180s

  api:
    build: *backend-build
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        alembic -c backend/alembic.ini upgrade head &&
        exec uvicorn backend.main:app --host 0.0.0.0 --port 8000
        --proxy-headers --forwarded-allow-ips='*'
    environment: *backend-environment
    volumes: *backend-volumes
    ports:
      - "127.0.0.1:${LINSEC_API_PORT:-8080}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wazuh.manager:
        condition: service_started
      wazuh.indexer:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    build: *backend-build
    restart: unless-stopped
    command:
      - rq
      - worker
      - deployments
      - --url
      - redis://redis:6379/0
      - --path
      - /opt/linsec
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  linsec_postgres:
  linsec_redis:
  linsec_var:
  linsec_logs:
  uyuni-postgresql-v3:
  uyuni-var-v3:
  uyuni-etc-v3:
  uyuni-certs-v3:
  uyuni-cache-v3:
  uyuni-spacewalk-v3:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
