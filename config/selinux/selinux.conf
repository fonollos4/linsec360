# /etc/selinux/config baseline managed by LinSec360.
#
# Deploy with taskengine/playbooks/hardening.yml. The hardening role overrides
# SELINUX and SELINUXTYPE from its variables, so this file is the safe default
# rather than the only source of truth.
#
# SELINUX can be enforcing, permissive, or disabled. Disabling SELinux is not a
# supported production state in LinSec360: it removes a required containment
# layer and makes the selinux.enforcing control fail permanently.
SELINUX=enforcing
SELINUXTYPE=targeted
